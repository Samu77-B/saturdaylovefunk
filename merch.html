<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merch | Saturday Love Funk</title>
  <meta name="description" content="Official Saturday Love Funk merchandise — tees and tote bag from The Big Club All Dayer.">
  <link rel="icon" type="image/png" href="images/fav.png">
  <link rel="preconnect" href="https://assets-persist.lovart.ai">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://paysynk.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/super-brave-2" rel="stylesheet">
  <link rel="preload" href="https://assets-persist.lovart.ai/agent-static-assets/MiSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="https://assets-persist.lovart.ai/agent-static-assets/NotoSerifCJKsc-Regular.otf" as="font" type="font/otf" crossorigin>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css" rel="stylesheet">
  <style>
    @font-face{font-family:'NotoSerifSC-Reg';src:url('https://assets-persist.lovart.ai/agent-static-assets/NotoSerifCJKsc-Regular.otf');font-weight:400;font-display:swap}
    @font-face{font-family:'MiSans';src:url('https://assets-persist.lovart.ai/agent-static-assets/MiSans-Regular.ttf');font-display:swap}
    :root{--primary-orange:#EE592D;--cream-beige:#F2DD99;--gold:#c9a961;--bg-dark:#0a0a0a;--text-light:#f5f1f0}
    *{margin:0;padding:0;box-sizing:border-box} html{scroll-behavior:smooth}
    body{width:100%;max-width:100%;background-color:var(--bg-dark);color:var(--text-light);font-family:'NotoSerifSC-Reg','Georgia','Times New Roman',serif;overflow-x:hidden}
    a{text-decoration:none;color:inherit;transition:.3s}
    .grid-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:100px 100px;pointer-events:none;z-index:999}
    .btn{display:inline-block;padding:12px 30px;font-family:'MiSans',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:1px;border:2px solid var(--gold);color:var(--gold);background:transparent;cursor:pointer;transition:all .3s ease;font-size:12px}
    .btn:hover{background:var(--gold);color:var(--bg-dark)} .btn-fill{background:var(--primary-orange);border-color:var(--primary-orange);color:#fff} .btn-fill:hover{background:#d4481f;border-color:#d4481f}
    header{width:100%;padding:20px;display:flex;flex-direction:column;align-items:stretch;background:rgba(10,10,10,.95);border-bottom:1px solid rgba(201,169,97,.2);position:fixed;top:0;z-index:1000;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:padding .3s ease,box-shadow .3s ease}
    .header-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;gap:8px;min-width:0}
    .header-left{justify-self:start;min-width:0;position:relative;z-index:2}
    .header-sponsors{justify-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;max-width:min(58vw,420px)}
    .header-sponsors-logos{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:18px}
    .header-actions{display:flex;align-items:center;gap:10px;justify-self:end;position:relative;z-index:2}
    .header-spotify-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--text-light);line-height:1;opacity:.95;transition:color .3s,opacity .3s;text-decoration:none;min-width:0}
    .header-spotify-link i{font-size:clamp(26px,5vw,38px);flex-shrink:0}
    .header-spotify-label{font-family:'MiSans',sans-serif;font-size:clamp(9px,2.4vw,12px);font-weight:700;letter-spacing:.04em;color:inherit;line-height:1.15;text-align:left;max-width:10em}
    .header-spotify-link:hover{color:#1ed760;opacity:1}
    header.scrolled-up .header-spotify-link i{font-size:clamp(22px,4.5vw,32px)}
    header.scrolled-up .header-spotify-label{font-size:clamp(8px,2.1vw,11px)}
    .logo{display:flex;align-items:center;gap:8px} .logo img{height:60px;width:auto;object-fit:contain}
    .logo img.logo-sponsor-phil,.header-sponsors img.logo-sponsor-phil{height:39px}
    .header-sponsors .logo-sponsor-wink-wrap img{height:60px;width:auto;object-fit:contain}
    .logo-sponsor-wink-label{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;color:#fff;line-height:1.15}
    .header-sponsors .logo-sponsor-wink-label{font-size:clamp(14px,3.5vw,20px);margin-bottom:8px;text-align:center;display:block;width:100%;white-space:nowrap}
    .menu-toggle{display:block;background:none;border:none;color:var(--text-light);font-size:48px;cursor:pointer;padding:5px;z-index:1001;position:relative;transition:font-size .3s ease}
    .menu-toggle:hover{color:var(--gold)} header.scrolled-up{padding:12px 20px;box-shadow:0 2px 10px rgba(0,0,0,.3)}
    header.scrolled-up .header-left .logo img{height:40px} header.scrolled-up .header-sponsors .logo-sponsor-wink-wrap img{height:40px} header.scrolled-up .menu-toggle{font-size:32px}
    nav{display:block;position:fixed;top:0;right:-100%;width:300px;max-width:80%;height:100vh;background:rgba(10,10,10,.98);border-left:1px solid rgba(201,169,97,.2);padding:80px 30px 30px;z-index:999;transition:right .6s ease;overflow-y:auto;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
    nav.active{right:0} nav ul{list-style:none;display:flex;flex-direction:column;gap:30px}
    nav a{font-family:'MiSans',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-light);position:relative;display:block;padding:15px 0;border-bottom:1px solid rgba(201,169,97,.1)}
    nav a:hover{color:var(--gold)}
    .nav-buttons{display:flex;flex-direction:column;gap:15px;margin-top:40px;padding-top:30px;border-top:1px solid rgba(201,169,97,.2)}
    .nav-btn{text-align:center;font-size:13px !important;padding:14px 25px !important;border-bottom:none !important;border:2px solid var(--gold) !important}
    .nav-btn.btn-fill{border-color:var(--primary-orange) !important}
    .nav-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:998;opacity:0;transition:opacity .6s ease}
    .nav-overlay.active{display:block;opacity:1}
    main{padding-top:115px}
    .merch-hero{width:min(1100px,calc(100% - 40px));margin:0 auto;padding:36px 0 12px}
    .merch-kicker{font-family:'MiSans',sans-serif;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);font-size:12px;margin-bottom:12px}
    .merch-title{font-family:'Anton',Impact,'Arial Black',sans-serif;text-transform:uppercase;font-size:clamp(38px,7vw,78px);line-height:1.05;background:linear-gradient(to bottom,#fff 30%,var(--cream-beige) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px}
    .merch-subtitle{font-family:'MiSans',sans-serif;font-size:16px;color:rgba(245,241,240,.9);max-width:70ch;line-height:1.7}
    .merch-body{width:min(1100px,calc(100% - 40px));margin:0 auto;padding:28px 0 70px}
    .merch-grid{display:grid;grid-template-columns:1fr;gap:24px}
    [data-paysynk-product]{width:100%;min-height:280px}
    [data-paysynk-product] > div{max-width:none !important;width:100%;height:100%;box-sizing:border-box}
    .merch-note{margin-top:28px;font-family:'MiSans',sans-serif;font-size:13px;color:#aaa;line-height:1.7}
    body:not(.ecom-live) .merch-hero,
    body:not(.ecom-live) .merch-body{display:none !important}
    footer{background:#050505;padding:40px 20px;border-top:1px solid #222;display:flex;flex-direction:column;gap:40px}
    .footer-col{width:100%}
    .footer-col h4{font-family:'MiSans',sans-serif;color:var(--gold);font-size:16px;margin-bottom:20px;text-transform:uppercase;letter-spacing:.06em}
    .footer-col p,.footer-col a{color:#bbb;font-family:'MiSans',sans-serif;font-size:13px;line-height:2;display:block}
    .footer-col a:hover{color:var(--primary-orange)}
    .footer-bottom{width:100%;text-align:center;padding:30px 20px;background:#000;color:#aaa;font-size:12px;font-family:'MiSans',sans-serif;display:flex;flex-direction:column;gap:10px}
    .footer-bottom a{color:var(--gold);text-decoration:none;transition:color .3s} .footer-bottom a:hover{color:var(--primary-orange)}
    .footer-powered-by{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}
    .footer-powered-by-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#888}
    .footer-powered-by-logo{height:clamp(24px,5vw,36px);width:auto;display:block}
    .btn i{margin-right:8px}
    @media (min-width:768px){
      header{padding:25px 40px} header.scrolled-up{padding:15px 30px}
      header.scrolled-up .header-left .logo img{height:50px}
      header.scrolled-up .header-sponsors .logo-sponsor-wink-wrap img{height:50px}
      header.scrolled-up .menu-toggle{font-size:40px}
      .logo img{height:75px} .header-sponsors .logo-sponsor-wink-wrap img{height:75px}
      .logo img.logo-sponsor-phil,.header-sponsors img.logo-sponsor-phil{height:49px}
      nav{width:400px;padding:100px 40px 40px} nav a{font-size:16px;padding:18px 0}
      footer{flex-direction:row;flex-wrap:wrap;padding:60px 40px;justify-content:space-between}
      .footer-col{width:calc(50% - 20px)} .footer-col p,.footer-col a{font-size:14px}
      main{padding-top:120px}
      .merch-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media (min-width:1024px){
      header{padding:25px 80px} header.scrolled-up{padding:15px 60px}
      .logo img{height:90px} .header-sponsors .logo-sponsor-wink-wrap img{height:90px}
      .logo img.logo-sponsor-phil,.header-sponsors img.logo-sponsor-phil{height:59px}
      footer{padding:80px 100px;flex-wrap:nowrap} .footer-col{width:auto}
      .merch-grid{grid-template-columns:repeat(3,1fr)}
    }
    @media (max-width:767px){
      header{padding:10px 12px}
      header.scrolled-up{padding:8px 14px 8px}
      .header-bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto;column-gap:6px;row-gap:0;align-items:center}
      .header-left{grid-column:1;grid-row:1}
      .header-actions{grid-column:3;grid-row:1;justify-self:end;gap:4px;flex-shrink:0}
      .header-sponsors{grid-column:2;grid-row:1;justify-self:center;width:auto;max-width:100%}
      .header-sponsors .logo-sponsor-wink-label{display:none}
      .header-sponsors-logos{gap:8px}
      .menu-toggle{font-size:36px;padding:2px 4px;line-height:1}
      header.scrolled-up .menu-toggle{font-size:32px}
      .header-spotify-link{gap:0}
      .header-spotify-link i{font-size:28px}
      header.scrolled-up .header-spotify-link i{font-size:24px}
      .header-spotify-label{display:none}
      nav{padding-top:80px}
      main{padding-top:80px}
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div id="header-container"></div>

  <main>
    <section class="merch-hero" aria-label="Merch">
      <div class="merch-kicker">Official merchandise</div>
      <h1 class="merch-title">Merch</h1>
      <p class="merch-subtitle">Saturday Love Funk tees and tote. Add to cart here — the cart stays in the header on every page, so you can keep browsing and check out when you’re ready.</p>
    </section>

    <section class="merch-body">
      <div class="merch-grid">
        <div data-paysynk-product="tote-bag" data-store="saturday-love-funk"></div>
        <div data-paysynk-product="classic-2024-limited-edition-tee" data-store="saturday-love-funk"></div>
        <div data-paysynk-product="adults-classic-tee" data-store="saturday-love-funk"></div>
      </div>
      <p class="merch-note">Checkout is powered by PaySynk. UK shipping is added at checkout.</p>
    </section>
  </main>

  <div id="footer-container"></div>
  <script src="components/header.js?v=19"></script>
  <script src="components/footer.js?v=12"></script>
  <script>
    if (window.PAYSYNK_SHOP_LIVE) {
      document.body.classList.add('ecom-live');
      var embed = document.createElement('script');
      embed.src = 'https://paysynk.com/embed.js';
      embed.defer = true;
      document.body.appendChild(embed);
    }
  </script>
</body>
</html>
